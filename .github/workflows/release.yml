name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag with locally prepared draft assets
        required: true
        type: string
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify source and download prepared assets
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          mkdir -p output/prepared-release
          gh release download "$RELEASE_TAG" --dir output/prepared-release
          cd output/prepared-release
          shasum -a 256 -c SHA256SUMS.txt
          ditto -x -k AIsland.zip .
      - name: Verify signed and notarized complete package
        run: python3 scripts/verify-aisland-package.py output/prepared-release --require-notarized --expected-source "$(git rev-parse HEAD)"
      - name: Publish verified release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
